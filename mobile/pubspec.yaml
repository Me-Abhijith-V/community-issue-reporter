name: community_issue_tracker
description: AI-Powered Community Issue Reporter & Tracker
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: "^3.12.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.5+1

  # REST API / networking
  dio: ^5.11.1

  # Secure JWT token storage
  flutter_secure_storage: ^11.0.0

  # Simple local preferences
  shared_preferences: ^2.5.5

  # Image selection / camera
  image_picker: ^1.2.3

  # Device GPS location
  geolocator: ^14.0.3

  # Google Maps
  google_maps_flutter: ^2.18.0

  # Voice to text
  speech_to_text: ^7.4.0

  # Firebase
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  # Local notifications
  flutter_local_notifications: ^22.3.0

  # Runtime permissions
  permission_handler: ^13.0.2

  # Date/time formatting
  intl: ^0.20.2

  # Reverse geocoding (coordinates → human-readable address)
  geocoding: ^3.0.0

  # iOS-style icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true