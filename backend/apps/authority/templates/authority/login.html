<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authority Login — Community Issue Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
        }
        .login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .login-card p { font-size: 13px; color: #94a3b8; margin-bottom: 28px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
        input {
            width: 100%;
            background: #334155;
            border: 1px solid #475569;
            color: #f1f5f9;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            margin-bottom: 18px;
            transition: border-color .15s;
        }
        input:focus { border-color: #3b82f6; }
        button {
            width: 100%;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: opacity .15s;
        }
        button:hover { opacity: .88; }
        .error {
            background: rgba(239,68,68,.15);
            border: 1px solid rgba(239,68,68,.3);
            color: #f87171;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🏛️ Authority Login</h1>
        <p>Community Issue Tracker — Official Portal</p>

        {% if messages %}
            {% for message in messages %}
            <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'authority:login' %}">
            {% csrf_token %}
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="authority@example.com" autocomplete="email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">

            <button type="submit">Sign In →</button>
        </form>
    </div>
</body>
</html>
